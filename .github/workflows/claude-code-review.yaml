name: claude-code-review

# Reviews pull requests automatically and posts findings as inline comments.
#
# Requires, both configured outside this file:
#   - the Claude GitHub App installed on the repository: https://github.com/apps/claude
#   - an ANTHROPIC_API_KEY repository or organization secret
# Without them the job fails to authenticate; nothing else in CI is affected.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # a docs-only change has nothing to review
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'

permissions:
  contents: read

jobs:
  review:
    # GitHub withholds secrets from pull requests opened from forks, so the review
    # cannot authenticate there. Skip rather than fail the check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # the inline-comment MCP tool must be allowed here for findings to be posted
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
